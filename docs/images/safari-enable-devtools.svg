<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Window background -->
  <rect width="520" height="320" fill="#f5f5f5" rx="10"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="520" height="40" fill="#e8e8e8" rx="10"/>
  <rect x="0" y="10" width="520" height="30" fill="#e8e8e8"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="20" r="6" fill="#febc2e"/>
  <circle cx="60" cy="20" r="6" fill="#28c840"/>
  <text x="220" y="25" fill="#333" font-size="13" text-anchor="middle" font-weight="500">Advanced</text>

  <!-- Tab bar -->
  <rect x="0" y="40" width="520" height="36" fill="#f0f0f0"/>
  <text x="40" y="63" fill="#888" font-size="12">General</text>
  <text x="120" y="63" fill="#888" font-size="12">Tabs</text>
  <text x="180" y="63" fill="#888" font-size="12">AutoFill</text>
  <text x="260" y="63" fill="#888" font-size="12">Passwords</text>
  <text x="350" y="63" fill="#888" font-size="12">Search</text>
  <text x="412" y="63" fill="#007aff" font-size="12" font-weight="600">Advanced</text>
  <rect x="398" y="72" width="68" height="2" fill="#007aff"/>

  <!-- Content area -->
  <rect x="20" y="90" width="480" height="210" fill="#fff" rx="8" stroke="#ddd" stroke-width="1"/>

  <!-- Settings items -->
  <text x="40" y="120" fill="#888" font-size="11">Smart Search Field</text>
  <text x="40" y="150" fill="#888" font-size="11">Accessibility</text>
  <text x="40" y="180" fill="#888" font-size="11">Page zoom</text>

  <!-- The important checkbox -->
  <rect x="34" y="200" width="456" height="40" fill="#e8f4fd" rx="6" stroke="#007aff" stroke-width="2"/>
  <rect x="46" y="212" width="18" height="18" fill="#007aff" rx="3"/>
  <text x="52" y="225" fill="#fff" font-size="14" font-weight="bold">✓</text>
  <text x="72" y="226" fill="#333" font-size="13" font-weight="500">Show features for web developers</text>

  <!-- Arrow -->
  <g>
    <rect x="310" y="248" width="180" height="34" fill="#ff3b30" rx="6"/>
    <text x="324" y="270" fill="#fff" font-size="12" font-weight="bold">☝ Enable this checkbox</text>
  </g>
</svg>
